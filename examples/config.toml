# tui-tools configuration.
#
# Read from /etc/tui-tools/config.toml first, then
# ~/.config/tui-tools/config.toml, with the user file overriding the
# machine-wide one. TUI_TOOLS_* environment variables override both, and
# command line flags override everything.

# Where the family catalog is fetched from.
#
# The catalog only informs: it says which tools exist and what each one is
# called to a package manager. Whatever it answers is validated here, and
# nothing from it reaches a command line except a name matching tui-<word>.
# Point it at a staging copy of the site and the same rules apply.
catalog = "https://tui.tools/catalog.json"

# Never fetch the catalog; use the snapshot built into this binary.
#
# The dashboard then shows the family as it stood when the binary was built,
# and says so in the header. --demo always reads the snapshot.
offline = false

# Privilege escalation prefix used for installs, updates, removals and the
# repository setup; "" runs the commands directly. Reading what is installed
# never escalates.
sudo = "sudo -n"

# Path to an Omarchy-style colors.toml. Empty follows the active Omarchy
# theme when present, and falls back to the built-in Tokyo Night palette.
theme = ""

# Every key can also be set in the environment, upper-cased and prefixed:
#   TUI_TOOLS_OFFLINE=true
#   TUI_TOOLS_SUDO="doas"
#   TUI_TOOLS_THEME=/etc/tui/colors.toml
